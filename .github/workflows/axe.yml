name: Axe accessibility testing

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies 💾
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Update _config.yml ⚙️
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ruby -ryaml -e '
            config = YAML.load_file("_config.yml")
            config["giscus"] ||= {}
            config["giscus"]["repo"] = ENV.fetch("GITHUB_REPOSITORY")
            config["baseurl"] = ""
            File.write("_config.yml", config.to_yaml)
          '
      - name: Install and Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: npx purgecss -c purgecss.config.js
      - name: Get Chromium version 🌐
        # https://github.com/GoogleChromeLabs/chrome-for-testing?tab=readme-ov-file#other-api-endpoints
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
          install-chromedriver: true
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        env:
          REQUESTED_PATH: ${{ github.event.inputs.url }}
        run: |
          npx http-server _site/ --silent &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://localhost:8080/ >/dev/null

          if [ -n "$REQUESTED_PATH" ]; then
            clean_path="${REQUESTED_PATH#/}"
            urls=("http://localhost:8080/$clean_path")
          else
            urls=(
              "http://localhost:8080/"
              "http://localhost:8080/research/"
              "http://localhost:8080/pi/"
              "http://localhost:8080/people/"
              "http://localhost:8080/publications/"
              "http://localhost:8080/news/"
              "http://localhost:8080/join/"
              "http://localhost:8080/activities/events/"
              "http://localhost:8080/activities/talks/"
              "http://localhost:8080/activities/services/"
              "http://localhost:8080/people/yifan_bai/"
              "http://localhost:8080/404.html"
            )
          fi

          run_axe() {
            if ! npx axe --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}" "$@" --load-delay=1500 --exit; then
              sleep 2
              npx axe --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}" "$@" --load-delay=1500 --exit
            fi
          }

          failed=0
          for url in "${urls[@]}"; do
            run_axe "$url" || failed=1
            run_axe --chrome-options="--force-dark-mode" "$url" || failed=1
          done
          exit "$failed"
