name: Axe accessibility testing

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ruby -ryaml -e '
            config = YAML.load_file("_config.yml")
            config["giscus"] ||= {}
            config["giscus"]["repo"] = ENV.fetch("GITHUB_REPOSITORY")
            config["baseurl"] = ""
            File.write("_config.yml", config.to_yaml)
          '
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Get Chromium version 🌐
        # https://github.com/GoogleChromeLabs/chrome-for-testing?tab=readme-ov-file#other-api-endpoints
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
          install-chromedriver: true
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          npm install -g @axe-core/cli
          npm install -g http-server
          http-server _site/ &
          if [ -n "${{ github.event.inputs.url }}" ]; then
            urls=("http://localhost:8080/${{ github.event.inputs.url }}")
          else
            urls=(
              "http://localhost:8080/"
              "http://localhost:8080/people/"
              "http://localhost:8080/publications/"
            )
          fi
          axe --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}" "${urls[@]}" --load-delay=1500 --exit
