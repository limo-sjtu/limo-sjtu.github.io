name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_plugins/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "purgecss.config.js"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/prettier.yml"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_plugins/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "purgecss.config.js"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/prettier.yml"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies 💾
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Validate structured content ✅
        run: ruby scripts/validate_content.rb
      - name: Audit al-folio compatibility 🔎
        run: |
          bundle exec al-folio upgrade audit
          bundle exec al-folio upgrade overrides audit --fail-on-stale
      - name: Update _config.yml ⚙️
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ruby -ryaml -e '
            config = YAML.load_file("_config.yml")
            config["giscus"] ||= {}
            config["giscus"]["repo"] = ENV.fetch("GITHUB_REPOSITORY")
            File.write("_config.yml", config.to_yaml)
          '
      - name: Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: npx purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
