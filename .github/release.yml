changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: profile updates 👤
      labels:
        - "type: profile"
    - title: publication updates 📚
      labels:
        - "type: publication"
    - title: news and activities 📣
      labels:
        - "type: news"
        - "type: activity"
    - title: corrections and maintenance 🛠️
      labels:
        - "type: correction"
        - "type: maintenance"
    - title: other changes 🛠️
      labels:
        - "*"
