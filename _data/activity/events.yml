- id: iciam2023
  start_date: "2023-08-20"
  end_date: "2023-08-25"
  date_display: 20–25 Aug 2023
  session: Recent Advances on Non-convex Optimization in Inverse Problems, Imaging and Machine Learning
  conference: International Congress on Industrial and Applied Mathematics (ICIAM2023)
  location: Tokyo, Japan
  organizers:
    - name: Guoyin Li
      affiliation: University of New South Wales, Australia
    - name: Jingwei Liang
      affiliation: Shanghai Jiao Tong University, China
    - name: Junqi Tang
      affiliation: University of Birmingham, UK
  session_url: https://iciam2023.org/registered_data?id=00521#04380
  conf_url: https://iciam2023.org/
  lang: en
  abstract: Non-convex optimization has become increasingly important for modern data science applications, with many unsolved challenging open problems. Due to the absence of convexity, the well-developed paradigms of convex optimization cannot be fully extended here, leading to the current situation that the theory of non-convex optimization is way behind the practice. In this mini-symposium, we focus on recent advances in non-convex optimization, including the analysis and understanding of the fundamental nature of the non-convex optimization, algorithmic bias/implicit regularization of gradient-based algorithms, fast convergent algorithms in non-convex problems, and their applications in inverse problems, imaging and machine learning and many others.
- id: csiam2022
  start_date: "2022-11-17"
  end_date: "2022-11-20"
  date_display: 17–20 Nov 2022
  session: 面向大规模图像数据科学问题的优化算法
  conference: CSIAM2022年会
  location: 广州（线上）
  organizers:
    - name: 董国志
      affiliation: 中南大学
    - name: 梁经纬
      affiliation: 上海交通大学
  session_url:
  conf_url: https://meeting.csiam.org.cn/#/2022/
  lang: zh-CN
  abstract: 随着科学计算中数据量的不断增加和数学建模精准性要求的不断提 高，算法效率逐渐成为实际应用问题求解时的瓶颈，对快速算法的 需求日益增加。本论坛将聚焦近几年算法加速技巧的发展，包含惯 性加速、随机算法等方面，也同时关注他们在实际问题中的应用。 计划邀请应用与算法两方面的专家进行交流，探讨更加有效的实际问题求解算法等发展方向。
